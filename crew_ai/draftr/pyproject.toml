[project]
name = "draftr"
version = "0.1.0"
description = "Intelligent RFP response crew — a CrewAI implementation within Agents-Playground"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "chromadb-client>=0.5.0",     # thin HTTP client — no onnxruntime transitive dependency
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
draftr      = "draftr.main:run"
run_crew    = "draftr.main:run"
train       = "draftr.main:train"
replay      = "draftr.main:replay"
test        = "draftr.main:test"
run_with_trigger = "draftr.main:run_with_trigger"
ingest_bids = "draftr.scripts.ingest_bids:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

# Platform overrides are declared at the workspace root (Agents-Playground/pyproject.toml).
