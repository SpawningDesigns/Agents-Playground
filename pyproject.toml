[project]
name = "agents-playground"
version = "0.1.0"
description = "AI/ML agent experiments and implementations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.95.0",
    "boto3>=1.42.89",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

# ── uv workspace ────────────────────────────────────────────────────────────
# Each member keeps its own pyproject.toml with its dependencies.
# A single .venv and uv.lock live at this root.
[tool.uv.workspace]
members = [
    "crew_ai/draftr",
]

[tool.uv]
# Platform overrides for Intel Mac (x86_64) — ignored on ARM Mac, Linux, Windows.
# torch: dropped Intel Mac wheels in 2.3.0; sentence-transformers requires >=1.11.
# onnxruntime: dropped Intel Mac wheels after 1.19.x; pulled in via crewai[tools].
override-dependencies = [
    "torch>=2.0.0,<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime<=1.19.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
